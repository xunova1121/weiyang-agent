<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>未央 · 服务器地址</title>
<style>
  :root { --bg: #f6f4ee; --fg: #24211c; --muted: #6f6a5f; --line: #e2ddd0; --accent: #2f6b5a; --error: #a33a24; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171a18; --fg: #e8e5dc; --muted: #a29d91; --line: #343a35; --accent: #6fb39c; --error: #f08b72; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; padding-inline: 16px; }
  form { width: min(420px, 100%); display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; }
  button { font: inherit; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  .error { color: var(--error); min-height: 1.6em; }
</style>
</head>
<body>
  <form id="f">
    <h1>连接你的未央服务器</h1>
    <p>填你在浏览器里打开未央用的地址（https:// 开头）。以后可以在右下角托盘图标的菜单里改。</p>
    <input id="url" placeholder="https://你的域名" required autofocus>
    <button type="submit">连接</button>
    <p id="err" class="error" role="alert"></p>
  </form>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('url').value = q.get('current') || '';
    document.getElementById('err').textContent = q.get('error') || '';
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await window.weiyangShell.setServer(document.getElementById('url').value);
      if (r?.error) document.getElementById('err').textContent = r.error;
    });
  </script>
</body>
</html>
