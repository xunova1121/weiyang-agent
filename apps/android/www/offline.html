<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>未央</title>
<style>
  :root { --bg: #f6f4ee; --fg: #24211c; --muted: #6f6a5f; --accent: #2f6b5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171a18; --fg: #e8e5dc; --muted: #a29d91; --accent: #6fb39c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; padding-inline: 16px; text-align: center; }
  p { color: var(--muted); }
  button { font: inherit; padding: 10px 28px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <main>
    <h1>连不上服务器</h1>
    <p>检查一下网络；服务器在更新时也会连不上一两分钟。</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">重试</button>
  </main>
</body>
</html>
