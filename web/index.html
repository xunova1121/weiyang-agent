<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>未央 Agent 版</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form">
      <h1>未央 <small>Agent 版</small></h1>
      <label>服务器密码<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>
  <main id="chat" class="chat" hidden>
    <header class="bar">
      <strong>未央</strong>
      <span id="status" class="status"></span>
      <button id="new-chat" type="button" class="ghost">新对话</button>
      <button id="logout" type="button" class="ghost">退出</button>
    </header>
    <section id="transcript" class="transcript" aria-live="polite"></section>
    <form id="composer" class="composer">
      <textarea id="prompt" rows="1" placeholder="说点什么…" title="Enter 发送，Shift+Enter 换行" required></textarea>
      <button id="send" type="submit">发送</button>
      <button id="stop" type="button" class="danger" hidden>停止</button>
    </form>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
