# 打包安卓 App 和 Windows 程序，发到 GitHub Releases（Windows 程序靠它自动更新）。
# 两个壳里跑的都是服务器的网页，功能跟着服务器更新；只有改了 apps/ 下的东西（或手动点 Run workflow）才需要重新打包。
name: 打包 App
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

jobs:
  # 先在 Linux 上真的启动一遍 Windows 程序（Electron），连本机测试服务器做端到端检查
  desktop-test:
    name: 测 Windows 程序
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: 装 Electron
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund && npm run sync
      - name: Windows 程序端到端
        run: xvfb-run -a node test/desktop.e2e.mjs

  android:
    name: 打包安卓 App
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: apps/android/android/**/*.gradle*
      - name: 生成配置、同步安卓工程
        working-directory: apps/android
        run: npm ci --no-audit --no-fund && npm run sync
      - name: 签名密钥
        shell: bash
        env:
          # 仓库 Settings → Secrets → ANDROID_SIGNING，值是“密码.密钥文件的base64”（和未央1 的格式一样）
          SIGNING: ${{ secrets.ANDROID_SIGNING }}
        # 有固定密钥：新版本能直接覆盖安装；没有时临时生成一个（能装，但升级前要先卸载旧版）
        run: |
          if [ -n "$SIGNING" ]; then
            SIGNING="$(printf '%s' "$SIGNING" | tr -d ' \r\n')"
            PASS="${SIGNING%%.*}"
            echo "::add-mask::$PASS"
            printf '%s' "${SIGNING#*.}" | base64 -d > "$RUNNER_TEMP/weiyang.keystore"
            ALIAS="$(keytool -list -keystore "$RUNNER_TEMP/weiyang.keystore" -storepass "$PASS" 2>/dev/null | awk -F, '/PrivateKeyEntry/{print $1; exit}')"
            echo "WEIYANG_KEY_ALIAS=${ALIAS:-weiyang}" >> "$GITHUB_ENV"
            echo "使用固定签名密钥"
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/weiyang.keystore" -alias weiyang -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Weiyang" -noprompt
            echo "::warning::没有设置 ANDROID_SIGNING，这次用临时密钥签名：手机上升级前需要先卸载旧版"
          fi
          echo "WEIYANG_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "WEIYANG_KEYSTORE=$RUNNER_TEMP/weiyang.keystore" >> "$GITHUB_ENV"
      - name: 打包 APK
        working-directory: apps/android/android
        shell: bash
        run: |
          export WEIYANG_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}" WEIYANG_VERSION_CODE="$GITHUB_RUN_NUMBER"
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/WeiyangAgent-1.0.${GITHUB_RUN_NUMBER}-android.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/out/"*.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out/*.apk

  windows:
    name: 打包 Windows 程序
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: 打包安装程序
        run: |
          npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          npm run dist
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # latest.yml 和 .blockmap 是自动更新要用的
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  release:
    name: 发布
    needs: [desktop-test, android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 发到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          ls -R out
          gh release create "v$V" out/android/*.apk out/windows/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "未央 App $V" \
            --notes "安卓：下载 .apk 安装（第一次要允许“安装未知来源应用”）。Windows：下载 WeiyangAgent-Setup-$V.exe 安装，以后会自动更新。两个都是连你自己服务器的窗口，功能跟着服务器更新。"
