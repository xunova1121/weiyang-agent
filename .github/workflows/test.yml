# 每次推送跑一遍测试（不需要任何密钥：模型是测试用的假模型）
name: 测试
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 装沙箱工具（运行命令的测试要用；起不来时那项测试会跳过并说明原因）
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y bubblewrap socat
      # Ubuntu 24.04 默认拦着沙箱：装上仓库里的 AppArmor 规则，顺便验证这条规则在真机上管用
      - name: 放行沙箱（AppArmor 规则）
        run: |
          sudo cp deploy/apparmor-bwrap /etc/apparmor.d/weiyang-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/weiyang-bwrap
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net true && echo "沙箱能用了"
      - name: 要求沙箱测试真的跑（不许跳过）
        run: echo "REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test

  # 测试全过后，把这个版本放进 stable 分支；服务器上的自动更新只拉 stable（见 deploy/update.sh）
  promote:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 推到 stable
        run: git push origin HEAD:refs/heads/stable
